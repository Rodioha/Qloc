name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      # --- ДОБАВЛЕННЫЙ ШАГ ---
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      # ----------------------

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Убрали openjdk-17-jdk отсюда, так как её уже настроил шаг выше
          sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libltdl-dev

      - name: Install Buildozer
        run: |
          pip install buildozer

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "===== LAST 200 LINES OF BUILD LOG ====="
            tail -n 200 build.log
            exit $EXIT_CODE
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: my-app-apk
          path: bin/*.apk

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-log
          path: build.log
